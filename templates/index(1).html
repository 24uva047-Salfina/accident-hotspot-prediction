<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accident Hotspot Prediction</title>

    <!-- ================= BOOTSTRAP ================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- ================= LEAFLET ================= -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        /* ================= SEARCH CARD ================= */

        .search-card {
            margin-top: 30px;
            position: relative;
            z-index: 10;
        }

        .main-card {
            border: none;
            border-radius: 16px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.08);
        }

        /* ================= MAP ================= */

        #map {
            height: 560px;
            border-radius: 14px;
        }

        /* ================= RESULT ================= */

        .result-box {
            background: #f8f9fa;
            border-radius: 14px;
            padding: 22px;
        }

        .risk-number {
            font-size: 45px;
            font-weight: 700;
        }

        /* ================= RISK CARDS ================= */

        .risk-card {
            border: none;
            border-radius: 14px;
            transition: 0.3s;
        }

        .risk-card:hover {
            transform: translateY(-5px);
        }

        .risk-icon {
            font-size: 32px;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #111827;
            color: white;
            margin-top: 50px;
            padding: 25px 0;
        }

    </style>

</head>


<body>


<!-- ================================================= -->
<!-- SEARCH -->
<!-- ================================================= -->

<div class="container search-card">

    <div class="card main-card">

        <div class="card-body p-4">

            <div class="row g-3 align-items-end">

                <!-- LOCATION SEARCH -->

                <div class="col-lg-9">

                    <label class="form-label fw-bold">

                        <i class="bi bi-geo-alt-fill"></i>

                        Search Location

                    </label>


                    <div class="input-group">

                        <input
                            type="text"
                            id="locationSearch"
                            class="form-control"
                            placeholder="Eg: Coimbatore, Gandhipuram, Chennai...">

                        <button
                            class="btn btn-primary"
                            onclick="searchLocation()">

                            <i class="bi bi-search"></i>

                            Search

                        </button>

                    </div>


                    <small class="text-muted">

                        Search any location, street or area in Tamil Nadu

                    </small>

                </div>


                <!-- PREDICT -->

                <div class="col-lg-3">

                    <button
                        class="btn btn-success w-100"
                        onclick="predictRisk()">

                        <i class="bi bi-graph-up-arrow"></i>

                        Predict Risk

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ================================================= -->
<!-- MAIN -->
<!-- ================================================= -->

<div class="container my-5">

    <div class="row g-4">


        <!-- ================================================= -->
        <!-- MAP -->
        <!-- ================================================= -->

        <div
            class="col-lg-8"
            id="mapSection">

            <div class="card main-card">

                <div class="card-header bg-white border-0 p-3">

                    <h5 class="fw-bold mb-0">

                        <i class="bi bi-map"></i>

                        Tamil Nadu Street Map

                    </h5>

                </div>


                <div class="card-body">

                    <div id="map"></div>

                </div>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- PREDICTION RESULT -->
        <!-- ================================================= -->

        <div
            class="col-lg-4"
            id="prediction">


            <!-- ================= PREDICTION CARD ================= -->

            <div class="card main-card">

                <div class="card-body">

                    <h5 class="fw-bold mb-4">

                        <i class="bi bi-bar-chart-line"></i>

                        Prediction Result

                    </h5>


                    <div class="result-box">


                        <!-- LOCATION -->

                        <p class="text-muted mb-1">

                            Location

                        </p>


                        <h5 id="resultLocation">

                            Tamil Nadu

                        </h5>


                        <hr>


                        <!-- ACCIDENT RISK -->

                        <p class="text-muted mb-1">

                            Accident Risk

                        </p>


                        <div
                            id="riskText"
                            class="risk-number">

                            75%

                        </div>


                        <span
                            id="riskBadge"
                            class="badge bg-danger">

                            HIGH RISK

                        </span>


                        <!-- PROGRESS -->

                        <div
                            class="progress mt-4"
                            style="height:12px;">

                            <div
                                id="riskProgress"
                                class="progress-bar bg-danger"
                                style="width:75%;">

                            </div>

                        </div>


                        <!-- RISK LEVEL -->

                        <p class="mt-3 mb-0">

                            <strong>
                                Risk Level:
                            </strong>

                            <span id="riskLevel">

                                High

                            </span>

                        </p>


                    </div>

                </div>

            </div>


            <!-- ================================================= -->
            <!-- WEATHER -->
            <!-- ================================================= -->

            <div class="card main-card mt-4">

                <div class="card-body">

                    <h5 class="fw-bold">

                        <i class="bi bi-cloud-sun"></i>

                        Weather Factors

                    </h5>


                    <div class="row text-center mt-4">


                        <!-- TEMPERATURE -->

                        <div class="col-4">

                            <i class="bi bi-thermometer-half fs-3"></i>

                            <p class="small mb-1">

                                Temperature

                            </p>

                            <strong id="temperature">

                                32°C

                            </strong>

                        </div>


                        <!-- HUMIDITY -->

                        <div class="col-4">

                            <i class="bi bi-droplet fs-3"></i>

                            <p class="small mb-1">

                                Humidity

                            </p>

                            <strong id="humidity">

                                70%

                            </strong>

                        </div>


                        <!-- WIND -->

                        <div class="col-4">

                            <i class="bi bi-wind fs-3"></i>

                            <p class="small mb-1">

                                Wind

                            </p>

                            <strong id="wind">

                                12 km/h

                            </strong>

                        </div>


                    </div>

                </div>

            </div>


        </div>

    </div>

</div>





<!-- ================================================= -->
<!-- BOOTSTRAP JS -->
<!-- ================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- ================================================= -->
<!-- LEAFLET JS -->
<!-- ================================================= -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


// =====================================================
// INITIAL TAMIL NADU MAP
// =====================================================

const map = L.map("map").setView(
    [11.1271, 78.6569],
    7
);


// =====================================================
// OPEN STREET MAP
// =====================================================

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,

        attribution:
            '&copy; OpenStreetMap contributors'
    }
).addTo(map);


// =====================================================
// CURRENT MARKER
// =====================================================

let currentMarker = null;


// =====================================================
// SEARCH LOCATION
// =====================================================

async function searchLocation() {

    const search =
        document
        .getElementById("locationSearch")
        .value
        .trim();


    // Check empty input

    if (search === "") {

        alert(
            "Please enter a location."
        );

        return;

    }


    // =================================================
    // SEARCH ONLY WITHIN TAMIL NADU
    // =================================================

    const query =
        search + ", Tamil Nadu, India";


    try {

        const response =
            await fetch(
                "https://nominatim.openstreetmap.org/search?" +
                new URLSearchParams({

                    q: query,

                    format: "json",

                    limit: 1,

                    countrycodes: "in",

                    addressdetails: 1

                }),
                {
                    headers: {

                        "Accept":
                            "application/json"

                    }

                }
            );


        const data =
            await response.json();


        // =================================================
        // LOCATION NOT FOUND
        // =================================================

        if (data.length === 0) {

            alert(
                "Location not found. Please try another Tamil Nadu location."
            );

            return;

        }


        const result =
            data[0];


        // =================================================
        // GET LATITUDE
        // =================================================

        const lat =
            parseFloat(result.lat);


        // =================================================
        // GET LONGITUDE
        // =================================================

        const lon =
            parseFloat(result.lon);


        // =================================================
        // MOVE MAP
        // =================================================

        map.setView(
            [lat, lon],
            14
        );


        // =================================================
        // REMOVE OLD MARKER
        // =================================================

        if (currentMarker) {

            map.removeLayer(
                currentMarker
            );

        }


        // =================================================
        // ADD NEW MARKER
        // =================================================

        currentMarker =
            L.marker(
                [lat, lon]
            ).addTo(map);


        // =================================================
        // MARKER POPUP
        // =================================================

        currentMarker
        .bindPopup(`

            <div>

                <strong>
                    ${result.display_name}
                </strong>

                <br>

                <small>
                    Tamil Nadu Location
                </small>

            </div>

        `)
        .openPopup();


        // =================================================
        // UPDATE RESULT LOCATION
        // =================================================

        document.getElementById(
            "resultLocation"
        ).innerText =
            result.display_name;


    }

    catch (error) {

        console.error(error);


        alert(
            "Unable to search location. Please try again."
        );

    }

}


// =====================================================
// ENTER KEY SEARCH
// =====================================================

document
.getElementById("locationSearch")
.addEventListener(
    "keypress",
    function(event) {

        if (event.key === "Enter") {

            searchLocation();

        }

    }
);


// =====================================================
// PREDICTION
// =====================================================

function predictRisk() {


    // =================================================
    // GET LOCATION
    // =================================================

    const location =
        document
        .getElementById("locationSearch")
        .value
        .trim();


    // =================================================
    // CHECK LOCATION
    // =================================================

    if (location === "") {

        alert(
            "Please search a location first."
        );

        return;

    }


    // =================================================
    // DEMO RISK CALCULATION
    // =================================================

    /*
        This is demo logic.

        Later you can replace this
        with your actual ML model/API.
    */


    let risk =
        Math.floor(
            Math.random() * 61
        ) + 35;


    // Maximum risk = 98

    if (risk > 98) {

        risk = 98;

    }


    // =================================================
    // UPDATE LOCATION
    // =================================================

    document.getElementById(
        "resultLocation"
    ).innerText =
        location + ", Tamil Nadu";


    // =================================================
    // GET RISK ELEMENTS
    // =================================================

    const riskText =
        document.getElementById(
            "riskText"
        );


    const riskBadge =
        document.getElementById(
            "riskBadge"
        );


    const progress =
        document.getElementById(
            "riskProgress"
        );


    const riskLevel =
        document.getElementById(
            "riskLevel"
        );


    // =================================================
    // HIGH RISK
    // =================================================

    if (risk >= 70) {


        riskText.innerText =
            risk + "%";


        riskText.className =
            "risk-number";


        riskBadge.innerText =
            "HIGH RISK";


        riskBadge.className =
            "badge bg-danger";


        progress.className =
            "progress-bar bg-danger";


        riskLevel.innerText =
            "High";

    }


    // =================================================
    // MEDIUM RISK
    // =================================================

    else if (risk >= 40) {


        riskText.innerText =
            risk + "%";


        riskText.className =
            "risk-number";


        riskBadge.innerText =
            "MEDIUM RISK";


        riskBadge.className =
            "badge bg-warning text-dark";


        progress.className =
            "progress-bar bg-warning";


        riskLevel.innerText =
            "Medium";

    }


    // =================================================
    // LOW RISK
    // =================================================

    else {


        riskText.innerText =
            risk + "%";


        riskText.className =
            "risk-number";


        riskBadge.innerText =
            "LOW RISK";


        riskBadge.className =
            "badge bg-success";


        progress.className =
            "progress-bar bg-success";


        riskLevel.innerText =
            "Low";

    }


    // =================================================
    // UPDATE PROGRESS BAR
    // =================================================

    progress.style.width =
        risk + "%";


    // =================================================
    // DEMO WEATHER VALUES
    // =================================================

    const temperature =
        28 +
        Math.floor(
            Math.random() * 8
        );


    const humidity =
        55 +
        Math.floor(
            Math.random() * 25
        );


    const wind =
        8 +
        Math.floor(
            Math.random() * 12
        );


    // =================================================
    // UPDATE TEMPERATURE
    // =================================================

    document.getElementById(
        "temperature"
    ).innerText =
        temperature + "°C";


    // =================================================
    // UPDATE HUMIDITY
    // =================================================

    document.getElementById(
        "humidity"
    ).innerText =
        humidity + "%";


    // =================================================
    // UPDATE WIND
    // =================================================

    document.getElementById(
        "wind"
    ).innerText =
        wind + " km/h";


    // =================================================
    // SCROLL TO PREDICTION RESULT
    // =================================================

    document
    .getElementById("prediction")
    .scrollIntoView({

        behavior: "smooth"

    });

}


// =====================================================
// MAP CLICK
// =====================================================

map.on(
    "click",
    function(e) {


        // =================================================
        // GET LATITUDE
        // =================================================

        const lat =
            e.latlng.lat;


        // =================================================
        // GET LONGITUDE
        // =================================================

        const lng =
            e.latlng.lng;


        // =================================================
        // REMOVE OLD MARKER
        // =================================================

        if (currentMarker) {

            map.removeLayer(
                currentMarker
            );

        }


        // =================================================
        // ADD MARKER
        // =================================================

        currentMarker =
            L.marker(
                [lat, lng]
            ).addTo(map);


        // =================================================
        // POPUP
        // =================================================

        currentMarker
        .bindPopup(`

            <strong>
                Selected Location
            </strong>

            <br>

            Latitude:
            ${lat.toFixed(5)}

            <br>

            Longitude:
            ${lng.toFixed(5)}

        `)
        .openPopup();


        // =================================================
        // UPDATE RESULT LOCATION
        // =================================================

        document.getElementById(
            "resultLocation"
        ).innerText =
            `Selected Map Location (${lat.toFixed(4)}, ${lng.toFixed(4)})`;

    }

);

</script>


</body>

</html>
